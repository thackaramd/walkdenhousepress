<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>The Parlour — Issue One</title>

<link
    rel="icon"
    href="/images/favicon.svg"
    type="image/svg+xml"
>

<style>

:root {

    --bg: #F2E9DF;

    --text: #241A18;

    --text-soft: rgba(36, 26, 24, 0.74);

    --accent: #7A564A;

    --line: rgba(36, 26, 24, 0.10);
}


/* --------------------------------
   PAGE
-------------------------------- */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    min-height: 100%;
}

html {
    background: var(--bg);
}

body {

    font-family:
        "Baskerville",
        "Times New Roman",
        serif;

    color: var(--text);

    min-height: 100vh;
    min-height: 100dvh;

    background: var(--bg);

    overflow-x: hidden;

    position: relative;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}


/* --------------------------------
   SUBTLE PAPER GRAIN
-------------------------------- */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.016;

    background-image:
        url("https://www.transparenttextures.com/patterns/asfalt-light.png");
}


/* --------------------------------
   MAIN
-------------------------------- */

main {

    width: 100%;

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;

    padding:
        76px
        24px
        100px;

    position: relative;
    z-index: 2;
}


/* --------------------------------
   PAGE CONTENT
-------------------------------- */

.issue-page {

    width: 100%;

    max-width: 720px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}


/* --------------------------------
   SMALL HEADING
-------------------------------- */

.kicker {

    margin-bottom: 20px;

    font-size: 0.72rem;

    letter-spacing: 2.2px;

    text-transform: uppercase;

    color: var(--text-soft);

    opacity: 0.72;
}


/* --------------------------------
   TITLE
-------------------------------- */

.issue-title {

    margin: 0;

    font-weight: normal;

    font-size: 2.35rem;

    letter-spacing: 0.2px;

    color: var(--text);
}


/* --------------------------------
   DIVIDER
-------------------------------- */

.divider {

    width: 48px;

    height: 1px;

    margin:
        24px auto
        52px;

    background: var(--line);
}


/* --------------------------------
   CAROUSEL
-------------------------------- */

.carousel {

    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    margin-bottom: 54px;
}


/* FIXED VIEWING WINDOW */

.carousel-frame {

    width: min(100%, 380px);

    aspect-ratio: 4 / 5;

    position: relative;

    overflow: hidden;

    border-radius: 2px;

    box-shadow:
        0 16px 38px rgba(36, 26, 24, 0.10);
}


/* SLIDING TRACK */

.carousel-track {

    display: flex;

    width: 100%;
    height: 100%;

    transition:
        transform 0.45s ease;
}


/* INDIVIDUAL SLIDE */

.carousel-slide {

    min-width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* IMAGE */

.carousel-image {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    object-position: center;
}


/* --------------------------------
   CAROUSEL ARROWS
-------------------------------- */

.carousel-button {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    border: 0;

    padding: 12px;

    background: transparent;

    color: var(--text-soft);

    font-family:
        "Baskerville",
        "Times New Roman",
        serif;

    font-size: 2.1rem;

    line-height: 1;

    cursor: pointer;

    opacity: 0.48;

    transition:
        opacity 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;

    z-index: 3;
}

.carousel-button:hover {

    opacity: 0.9;

    color: var(--text);
}

.carousel-button.prev {

    left: 2px;
}

.carousel-button.next {

    right: 2px;
}


/* --------------------------------
   DESCRIPTION
-------------------------------- */

.issue-description {

    width: 100%;

    max-width: 570px;

    margin-bottom: 42px;

    color: var(--text-soft);

    font-size: 1.05rem;

    line-height: 1.9;
}

.issue-description p {

    margin:
        0
        0
        20px;
}

.issue-description p:last-child {
    margin-bottom: 0;
}


/* --------------------------------
   PURCHASE BUTTON
-------------------------------- */

.purchase-link {

    display: inline-block;

    padding:
        15px
        25px;

    border:
        1px solid
        rgba(36, 26, 24, 0.24);

    text-decoration: none;

    color: var(--text);

    font-size: 1rem;

    letter-spacing: 0.12px;

    background:
        rgba(255,255,255,0.10);

    transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
}

.purchase-link:hover {

    background:
        rgba(122, 86, 74, 0.06);

    border-color:
        rgba(122, 86, 74, 0.45);

    transform: translateY(-1px);
}


/* --------------------------------
   RETURN LINK
-------------------------------- */

.return-link {

    margin-top: 48px;

    font-size: 0.88rem;

    color: var(--text-soft);

    text-decoration: none;

    opacity: 0.72;

    transition:
        opacity 0.25s ease,
        color 0.25s ease;
}

.return-link:hover {

    opacity: 1;

    color: var(--text);
}


/* --------------------------------
   ACCESSIBILITY
-------------------------------- */

a:focus-visible,
button:focus-visible {

    outline:
        1px solid
        var(--accent);

    outline-offset: 4px;
}


/* --------------------------------
   FADE
-------------------------------- */

.issue-page {

    animation:
        fadeIn 1.2s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* --------------------------------
   MOBILE
-------------------------------- */

@media (max-width: 600px) {

    main {

        padding:
            max(54px, env(safe-area-inset-top))
            20px
            max(76px, env(safe-area-inset-bottom));
    }

    .kicker {

        font-size: 0.65rem;

        letter-spacing: 1.9px;

        margin-bottom: 17px;
    }

    .issue-title {

        font-size: 2rem;
    }

    .divider {

        margin-bottom: 42px;
    }

    .carousel {

        margin-bottom: 46px;
    }

    .carousel-frame {

        width: min(100%, 325px);
    }

    .carousel-button {

        font-size: 1.8rem;

        padding: 8px;
    }

    .carousel-button.prev {

        left: -5px;
    }

    .carousel-button.next {

        right: -5px;
    }

    .issue-description {

        max-width: 340px;

        font-size: 0.98rem;

        line-height: 1.85;

        margin-bottom: 36px;
    }

    .purchase-link {

        padding:
            14px
            20px;

        font-size: 0.94rem;
    }

    .return-link {

        margin-top: 42px;
    }
}


/* --------------------------------
   VERY SMALL MOBILE
-------------------------------- */

@media (max-width: 370px) {

    .carousel-frame {

        width: min(100%, 295px);
    }

    .carousel-button.prev {

        left: -8px;
    }

    .carousel-button.next {

        right: -8px;
    }
}

</style>
</head>


<body>

<main>

    <div class="issue-page">

        <div class="kicker">
            The Parlour
        </div>

        <h1 class="issue-title">
            Issue One
        </h1>

        <div class="divider"></div>


        <!-- CAROUSEL -->

        <div
            class="carousel"
            id="carousel"
        >

            <button
                class="carousel-button prev"
                type="button"
                aria-label="Previous photograph"
                onclick="previousSlide()"
            >
                ‹
            </button>


            <div class="carousel-frame">

                <div
                    class="carousel-track"
                    id="carouselTrack"
                >

                    <div class="carousel-slide">

                        <img
                            src="images/parlour-issue-one.png"
                            alt="The Parlour Issue One front cover"
                            class="carousel-image"
                        >

                    </div>


                    <div class="carousel-slide">

                        <img
                            src="images/parlour-issue-one-2.png"
                            alt="Contents pages of The Parlour Issue One"
                            class="carousel-image"
                        >

                    </div>


                    <div class="carousel-slide">

                        <img
                            src="images/parlour-issue-one-3.png"
                            alt="Back cover of The Parlour Issue One"
                            class="carousel-image"
                        >

                    </div>


                    <div class="carousel-slide">

                        <img
                            src="images/parlour-issue-one-4.png"
                            alt="Title page of The Parlour Issue One"
                            class="carousel-image"
                        >

                    </div>

                </div>

            </div>


            <button
                class="carousel-button next"
                type="button"
                aria-label="Next photograph"
                onclick="nextSlide()"
            >
                ›
            </button>

        </div>


        <!-- DESCRIPTION -->

        <div class="issue-description">

            <p>
                The first issue of <em>The Parlour</em>,
                published in Bedford in Summer 2026.
            </p>

            <p>
                A collection of poetry, fiction, art,
                and other writing from Bedford and beyond.
            </p>

        </div>


        <!-- PURCHASE -->

        <a
            href="#"
            class="purchase-link"
        >
            Purchase and Read the Digital Edition for £5
        </a>


        <!-- RETURN -->

        <a
            href="the-parlour.html"
            class="return-link"
        >
            Return to The Parlour
        </a>

    </div>

</main>


<script>

const track =
    document.getElementById("carouselTrack");

const slides =
    document.querySelectorAll(".carousel-slide");

const carousel =
    document.getElementById("carousel");

let currentSlide = 0;


/* --------------------------------
   UPDATE CAROUSEL
-------------------------------- */

function updateCarousel() {

    track.style.transform =
        `translateX(-${currentSlide * 100}%)`;
}


/* --------------------------------
   NEXT
-------------------------------- */

function nextSlide() {

    currentSlide =
        (currentSlide + 1) % slides.length;

    updateCarousel();
}


/* --------------------------------
   PREVIOUS
-------------------------------- */

function previousSlide() {

    currentSlide =
        (currentSlide - 1 + slides.length)
        % slides.length;

    updateCarousel();
}


/* --------------------------------
   SWIPE SUPPORT
-------------------------------- */

let touchStartX = 0;
let touchEndX = 0;

carousel.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0].screenX;
    },
    {
        passive: true
    }
);

carousel.addEventListener(
    "touchend",
    function(event) {

        touchEndX =
            event.changedTouches[0].screenX;

        handleSwipe();
    },
    {
        passive: true
    }
);


function handleSwipe() {

    const distance =
        touchStartX - touchEndX;

    const threshold = 45;

    if (distance > threshold) {

        nextSlide();

    } else if (distance < -threshold) {

        previousSlide();
    }
}


/* --------------------------------
   KEYBOARD SUPPORT
-------------------------------- */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowRight") {
            nextSlide();
        }

        if (event.key === "ArrowLeft") {
            previousSlide();
        }
    }
);

</script>

</body>
</html>
