<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<link
    rel="icon"
    href="/images/favicon.svg"
    type="image/svg"
>

<title>Walkden House Press</title>

<style>

:root {

    --bg: #F2E9DF;

    --text: #241A18;

    --text-soft: rgba(36, 26, 24, 0.74);

    --accent: #7A564A;

    --line: rgba(36, 26, 24, 0.055);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    font-family:
        "Baskerville",
        "Times New Roman",
        serif;

    color: var(--text);

    min-height: 100vh;

    display: flex;
    flex-direction: column;

    background: var(--bg);

    overflow-x: hidden;

    position: relative;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

/* SUBTLE PAPER GRAIN */

body::before {

    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0.016;

    background-image:
        url("https://www.transparenttextures.com/patterns/asfalt-light.png");
}

/* HEADER */

.header {

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 34px 64px 26px;

    gap: 32px;

    position: relative;
    z-index: 2;
}

/* BRAND */

.title-wrapper {

    display: flex;
    align-items: center;

    min-width: 0;

    text-decoration: none;
    color: inherit;

    transition:
        transform 0.28s ease,
        opacity 0.28s ease;
}

.title-wrapper {
    min-height: 2.7rem;
}

.title-group {

    display: flex;
    flex-direction: column;
}

.title {

    font-size: 1.5rem;

    letter-spacing: 0.15px;

    color: var(--text);

    white-space: nowrap;
}

.subtitle {

    margin-top: 2px;

    font-size: 0.66rem;

    letter-spacing: 1px;
    text-transform: uppercase;

    color: var(--text-soft);

    opacity: 0.82;
}

/* NAVIGATION */

.nav {

    display: flex;
    align-items: center;

    margin-left: auto;

    gap: 32px;

    font-size: 1.02rem;

    letter-spacing: 0.18px;

    white-space: nowrap;
}

.nav a {

    text-decoration: none;

    color: var(--text-soft);

    position: relative;

    transition:
        color 0.25s ease,
        opacity 0.25s ease;
}

.nav a::after {

    content: "";

    position: absolute;

    left: 0;
    bottom: -4px;

    width: 100%;
    height: 1px;

    background: var(--accent);

    opacity: 0;
    transform: scaleX(0.7);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.nav a:hover {

    color: var(--text);
}

.nav a:hover::after {

    opacity: 0.42;
    transform: scaleX(1);
}

.nav a.italic {

    font-style: italic;
}

/* DIVIDER */

.line {

    height: 1px;

    width: calc(100% - 120px);

    margin: 0 auto;

    opacity: 0.34;

    background:
        linear-gradient(
            to right,
            transparent,
            var(--line),
            transparent
        );
}

/* MAIN */

main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 32px 24px 64px;
    position: relative;
    z-index: 2;
}

.issue-feature {
    display: grid;
    justify-items: center;
    gap: 12px;
}

.printer-mark {
    display: block;
    width: clamp(44px, 6vw, 58px);
    height: auto;
}

.issue-link {
    display: grid;
    justify-items: center;
    gap: 6px;
    padding: 12px 16px;
    font-size: 1.125rem;
    line-height: 1.3;
    text-align: center;
    color: var(--text);
    text-decoration: none;
}

.issue-link-action {
    font-size: 0.875rem;
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
}

.issue-link:hover .issue-link-action,
.issue-link:focus-visible .issue-link-action {
    color: var(--text);
}

/* SUBTLE FADE */

.header,
.line {

    animation: fadeIn 1.6s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* HAMBURGER */

.hamburger {

    display: none;

    flex-direction: column;
    justify-content: space-between;

    width: 22px;
    height: 15px;

    cursor: pointer;
}

.hamburger div {

    height: 1px;

    background-color: var(--text);
}

/* MOBILE MENU */

.mobile-menu {

    position: fixed;
    inset: 0;

    background-color: transparent;

    z-index: 1000;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    visibility: hidden;
    pointer-events: none;

    transition: background-color 340ms ease, visibility 0s 340ms;
}

.mobile-menu.show {

    background-color: var(--bg);
    transition-delay: 0s;
    visibility: visible;
    pointer-events: auto;
}

.mobile-menu-header {
    display: flex;

    position: absolute;

    top: 32px;
    right: 22px;
}

.close-icon {

    width: 22px;
    height: 22px;

    cursor: pointer;

    position: relative;
}

/* Keep the icon independent of the fading menu backdrop. */
.hamburger {
    transition: opacity 180ms ease;
}

body:has(.mobile-menu.show) .hamburger {
    opacity: 0;
}

.mobile-menu-inner {
    opacity: 0;
    transition: opacity 340ms ease;
}

.mobile-menu.show .mobile-menu-inner {
    opacity: 1;
}

.close-icon {
    opacity: 0;
    transition: opacity 180ms ease;
}

.mobile-menu.show .close-icon {
    opacity: 1;
}

.close-icon::before,
.close-icon::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 1px;
    background-color: var(--text);
}

.close-icon::before { transform: translateY(-50%) rotate(45deg); }
.close-icon::after { transform: translateY(-50%) rotate(-45deg); }

@media (prefers-reduced-motion: reduce) {
    .hamburger,
    .mobile-menu,
    .mobile-menu-inner,
    .mobile-menu a,
    .close-icon {
        transition: none;
    }
}



/* MOBILE MENU INNER */

.mobile-menu-inner {

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* MOBILE MENU KICKER */

.mobile-kicker {

    margin-bottom: 42px;

    font-size: 0.62rem;

    letter-spacing: 2.6px;
    text-transform: uppercase;

    color: var(--text-soft);

    opacity: 0.68;
}

/* MOBILE NAV */

.mobile-menu nav {

    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 30px;
}

.mobile-menu a {

    color: var(--text);

    text-decoration: none;

    font-size: 1.18rem;

    letter-spacing: 0.18px;

    opacity: 0;

    transform: translateY(8px);

    transition:
        opacity 0.5s ease,
        transform 0.5s ease,
        color 0.25s ease;
}

.mobile-menu.show a {

    opacity: 1;

    transform: translateY(0);
}

/* STAGGER */

.mobile-menu.show a:nth-child(1) {

    transition-delay: 0.08s;
}

.mobile-menu.show a:nth-child(2) {

    transition-delay: 0.14s;
}

.mobile-menu.show a:nth-child(3) {

    transition-delay: 0.2s;
}

.mobile-menu.show a:nth-child(4) {

    transition-delay: 0.26s;
}

.mobile-menu a:hover {

    color: var(--accent);
}

/* ACCESSIBILITY */

a:focus-visible {

    outline: 1px solid var(--accent);

    outline-offset: 4px;
}

/* COMPRESSED DESKTOP / TABLET */

@media (max-width: 1100px) {

    .header {

        padding: 24px 36px 20px;

        gap: 20px;
    }

    .title-wrapper {
        min-height: 2.6rem;
    }

    .title {

        font-size: 1.25rem;
    }

    .nav {

        gap: 22px;

        font-size: 0.96rem;
    }

    .line {

        width: calc(100% - 64px);
    }
}

/* MOBILE */

@media (max-width: 760px) {

    .header {

        padding: 14px 22px;

        align-items: center;
    }

    .nav {

        display: none;
    }

    .hamburger {

        display: flex;
    }

    .title {

        font-size: 1.12rem;
    }

    .subtitle {

        font-size: 0.54rem;

        letter-spacing: 0.8px;
    }

    .title-wrapper {
        min-height: 2.1rem;
    }

    .line {

        width: calc(100% - 44px);
    }


    .mobile-menu nav {

        gap: 26px;
    }

    .mobile-menu a {

        font-size: 1.08rem;
    }
}


        /* The masthead remains while the content moves beneath it. */
        body:not(.menu-open) { overflow-x: clip; }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            background: var(--bg);
            /* A diffuse, low-contrast fall-off rather than a visible edge. */
            box-shadow: 0 12px 28px -18px rgba(36, 26, 24, 0.08);
        }
        @media (min-width: 761px) {
            .header {
                min-height: 80px;
                padding-top: 16px;
                padding-bottom: 16px;
                animation: none;
            }
        }
    
/* Keep the two masthead lines proportionate on desktop. */
@media (min-width: 761px) {
    .subtitle {
        margin-top: 1px;
        font-size: 0.60rem;
        letter-spacing: 0.9px;
    }
}
</style>
</head>

<body>

<header class="header">

    <a
        href="index.html"
        class="title-wrapper"
        aria-label="Walkden House Press Home"
    >

        <div class="title-group">

            <div class="title">
                Walkden House Press
            </div>

            <div class="subtitle">
                Independent Publisher
            </div>

        </div>

    </a>

    <nav class="nav">

        <a href="about.html">
            About
        </a>

        <a href="the-parlour.html">
            The Parlour
        </a>

        <a href="common-room.html">
            Common Room
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

    <div
        class="hamburger"
        onclick="toggleMenu()"
        aria-label="Open menu"
    >
        <div></div>
        <div></div>
        <div></div>
    </div>

</header>

<div class="line"></div>

<main>
    <div class="issue-feature">
        <img class="printer-mark" src="images/printer-door.svg" width="879" height="1790" alt="Walkden House Press printer’s mark">
        <a class="issue-link" href="https://walkdenhousepress.co.uk/the-parlour-issue-one.html">
            <em>The Parlour</em>
            <span class="issue-link-action">View Issue One</span>
        </a>
    </div>
</main>

<!-- MOBILE MENU -->

<div
    class="mobile-menu"
    id="mobileMenu"
>

    <div class="mobile-menu-header">

        <div
            class="close-icon"
            onclick="toggleMenu()"
            aria-label="Close menu"
        ></div>

    </div>

    <div class="mobile-menu-inner">

        <div class="mobile-kicker">
            Walkden House Press
        </div>

        <nav>

            <a href="about.html">
                About
            </a>

            <a href="the-parlour.html">
                The Parlour
            </a>

            <a href="common-room.html">
                Common Room
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </div>

</div>

<script>

function toggleMenu() {

    document
        .getElementById('mobileMenu')
        .classList
        .toggle('show');
}

</script>



<script>
// Centre the close control on the menu trigger before the overlay appears.
document.querySelector(".hamburger").addEventListener("click", function () {
    const trigger = this.getBoundingClientRect();
    const menuHeader = document.querySelector(".mobile-menu-header");
    menuHeader.style.left = (trigger.left + trigger.width / 2) + "px";
    menuHeader.style.top = (trigger.top + trigger.height / 2) + "px";
    menuHeader.style.right = "auto";
    menuHeader.style.transform = "translate(-50%, -50%)";
}, true);
</script>

</body>
</html>
