<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

    <title>Your Digital Edition | Walkden House Press</title>

    <meta
        name="description"
        content="Access The Parlour — Issue One from Walkden House Press."
    />

    <style>
        :root {
            --bg: #f2e9df;
            --text: #241a18;
            --text-soft: rgba(36, 26, 24, 0.74);
            --accent: #7a564a;
            --line: rgba(36, 26, 24, 0.055);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            background: var(--bg);
            font-family: "Baskerville", "Times New Roman", serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.016;
            background-image:
                url("https://www.transparenttextures.com/patterns/asfalt-light.png");
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 34px 64px 26px;
            gap: 32px;
            position: relative;
            z-index: 2;
        }

        .title-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            min-width: 0;
            color: inherit;
            text-decoration: none;
        }

        .title-wrapper img {
            width: auto;
            height: 2.7rem;
            display: block;
            flex-shrink: 0;
            transform: translateY(0.12rem);
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 1.72rem;
            letter-spacing: 0.15px;
            white-space: nowrap;
        }

        .subtitle {
            margin-top: 2px;
            color: var(--text-soft);
            opacity: 0.82;
            font-size: 0.66rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            align-items: center;
            margin-left: auto;
            gap: 32px;
            font-size: 1.02rem;
            white-space: nowrap;
        }

        .nav a {
            color: var(--text-soft);
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--text);
        }

        .line {
            width: calc(100% - 120px);
            height: 1px;
            margin: 0 auto;
            opacity: 0.34;
            background:
                linear-gradient(to right, transparent, var(--line), transparent);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 76px 24px 120px;
            position: relative;
            z-index: 2;
        }

        .content {
            width: 100%;
            max-width: 680px;
            text-align: center;
            animation: fadeIn 1.6s ease;
        }

        .kicker {
            margin-bottom: 26px;
            color: var(--text-soft);
            opacity: 0.68;
            font-size: 0.72rem;
            letter-spacing: 2.2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 34px;
            font-size: 2.4rem;
            font-weight: normal;
            letter-spacing: 0.2px;
        }

        .message {
            margin: 0 auto 28px;
            font-size: 1.18rem;
            line-height: 1.85;
        }

        .reader-link {
            display: inline-block;
            margin-top: 11px;
            padding: 14px 32px;
            border: 1px solid rgba(36, 26, 24, 0.25);
            color: var(--text);
            background: transparent;
            text-decoration: none;
            font-size: 1.02rem;
            transition:
                background-color 0.3s ease,
                border-color 0.3s ease;
        }

        .reader-link:hover {
            background: rgba(36, 26, 24, 0.05);
            border-color: rgba(36, 26, 24, 0.34);
        }

        .test-note {
            margin: 32px auto 0;
            color: var(--text-soft);
            font-size: 0.82rem;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 760px) {
            .header {
                padding: 18px 22px;
            }

            .nav {
                display: none;
            }

            .title-wrapper {
                gap: 8px;
            }

            .title {
                font-size: 1.12rem;
            }

            .subtitle {
                font-size: 0.54rem;
                letter-spacing: 0.8px;
            }

            .title-wrapper img {
                height: 2.1rem;
                transform: translateY(0.03rem);
            }

            .line {
                width: calc(100% - 44px);
            }

            main {
                padding: 56px 20px 90px;
            }

            h1 {
                font-size: 1.84rem;
            }

            .message {
                font-size: 1.02rem;
                line-height: 1.82;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <a
            href="index.html"
            class="title-wrapper"
            aria-label="Walkden House Press Home"
        >
            <img
                src="images/colophon.svg"
                alt="Walkden House Press logo"
            />

            <div class="title-group">
                <div class="title">Walkden House Press</div>

                <div class="subtitle">
                    Independent Publisher · Est. 2026
                </div>
            </div>
        </a>

        <nav class="nav" aria-label="Primary navigation">
            <a href="about.html">About</a>
            <a href="the-parlour.html" class="active">The Parlour</a>
            <a href="common-room.html">Common Room</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="line"></div>

    <main>
        <section class="content" aria-labelledby="access-title">
            <div class="kicker">Digital Edition</div>

            <h1 id="access-title">PURCHASE RECEIVED</h1>

            <p class="message" id="accessMessage">
                Thank you. Your copy of <em>The Parlour</em> — Issue One
                is ready.
            </p>

            <a
                class="reader-link"
                id="readerLink"
                href="pdfjs/web/viewer.html?file=%2Fdigital%2Fissue-one%2FThe%20Parlour%20-%20Issue%20One%20-%20Reader.pdf"
                target="_blank"
                rel="noopener noreferrer"
            >
                Begin Reading
            </a>

            <p class="test-note" id="testNote">
                Sandbox test only — no real payment has been taken.
            </p>
        </section>
    </main>

    <script>
        const sessionId = new URLSearchParams(window.location.search)
            .get("session_id");

        if (!sessionId || !sessionId.startsWith("cs_")) {
            document.getElementById("access-title").textContent =
                "ACCESS LINK INCOMPLETE";

            document.getElementById("accessMessage").textContent =
                "Please return to the Issue One page and complete checkout.";

            document.getElementById("readerLink").hidden = true;
            document.getElementById("testNote").hidden = true;
        }
    </script>
</body>
</html>
